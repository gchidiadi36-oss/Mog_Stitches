
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password | MOG Stitches</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f5f8;
            font-family: Arial, sans-serif;
        }

        .password-card {
            width: 100%;
            max-width: 430px;
            padding: 32px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.09);
        }

        h1 {
            margin-top: 0;
            color: #0B1F4B;
            font-size: 25px;
        }

        .subtitle {
            color: #666;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 16px 0 7px;
            color: #222;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #D4AF37;
            border-color: #0B1F4B;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            background: #0B1F4B;
            color: #D4AF37;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #16346e;
        }

        .message {
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 16px;
            line-height: 1.5;
        }

        .success {
            background: #e8f7ec;
            color: #17652b;
        }

        .error {
            background: #fdeaea;
            color: #a21d1d;
        }

        .back-link {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #0B1F4B;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="password-card">
        <h1>🔑 Change Password</h1>

        <p class="subtitle">
            Update your MOG Stitches administrator password securely.
        </p>

        {% if message %}
            <div class="message success">{{ message }}</div>
        {% endif %}

        {% if error %}
            <div class="message error">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <label for="current_password">Current Password</label>
            <input
                type="password"
                id="current_password"
                name="current_password"
                autocomplete="current-password"
                required
            >

            <label for="new_password">New Password</label>
            <input
                type="password"
                id="new_password"
                name="new_password"
                minlength="8"
                autocomplete="new-password"
                required
            >

            <label for="confirm_password">Confirm New Password</label>
            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                minlength="8"
                autocomplete="new-password"
                required
            >

            <button type="submit">Update Password</button>
        </form>

        <a class="back-link"
           href="{{ url_for('admin_dashboard') }}">
            ← Back to Admin Dashboard
        </a>
    </div>
</body>
</html>
